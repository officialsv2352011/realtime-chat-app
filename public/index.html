<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUPTLOK // SECURE-CHAT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           DYNAMIC THEME VARIABLES (CSS ENGINE)
           ========================================= */
        :root {
            --bg-pattern: none;
        }

        /* 🔵 THEME 1: NORMAL (Modern Dark Mode) */
        .theme-normal {
            --bg-main: #0f172a;        /* slate-900 */
            --bg-panel: #1e293b;       /* slate-800 */
            --bg-input: #0f172a;
            --text-main: #f8fafc;
            --text-mut: #94a3b8;
            --pri: #6366f1;            /* indigo-500 */
            --pri-hover: #4f46e5;
            --sec: #8b5cf6;            /* violet-500 */
            --bdr: #334155;            /* slate-700 */
            --msg-me-bg: #4f46e5;
            --msg-me-bdr: #4f46e5;
            --msg-me-txt: #ffffff;
            --msg-oth-bg: #1e293b;
            --msg-oth-bdr: #334155;
            --msg-oth-txt: #f8fafc;
            --font-head: 'Inter', sans-serif;
            --font-body: 'Inter', sans-serif;
            --radius-main: 1rem;
            --radius-btn: 0.75rem;
            --glow-pri: 0 4px 10px rgba(99, 102, 241, 0.3);
            --bg-pattern: none;
        }

        /* 🤖 THEME 2: CYBER (Deep Cyber-Blue Neon) */
        .theme-cyber {
            --bg-main: #0B1020;        
            --bg-panel: #111827;       
            --bg-input: #0B1020;
            --text-main: #E2E8F0;      
            --text-mut: rgba(226, 232, 240, 0.5);
            --pri: #00D9FF;            
            --pri-hover: #2563EB;      
            --sec: #2563EB;
            --bdr: rgba(0, 217, 255, 0.4);
            --msg-me-bg: #111827;
            --msg-me-bdr: #00D9FF;
            --msg-me-txt: #E2E8F0;
            --msg-oth-bg: #111827;
            --msg-oth-bdr: #2563EB;
            --msg-oth-txt: #E2E8F0;
            --font-head: 'Orbitron', sans-serif;
            --font-body: 'Share Tech Mono', monospace;
            --radius-main: 0px;
            --radius-btn: 0px;
            --glow-pri: 0px 0px 15px rgba(0, 217, 255, 0.3);
            --bg-pattern: linear-gradient(rgba(0, 217, 255, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 217, 255, 0.04) 1px, transparent 1px);
        }

        /* 👨‍💻 THEME 3: HACKER (Matrix Green Terminal) */
        .theme-hacker {
            --bg-main: #000000;
            --bg-panel: #050505;
            --bg-input: #000000;
            --text-main: #00FF41;
            --text-mut: #008F11;
            --pri: #00FF41;
            --pri-hover: #008F11;
            --sec: #008F11;
            --bdr: #00FF41;
            --msg-me-bg: #000000;
            --msg-me-bdr: #00FF41;
            --msg-me-txt: #00FF41;
            --msg-oth-bg: #050505;
            --msg-oth-bdr: #008F11;
            --msg-oth-txt: #00FF41;
            --font-head: 'Share Tech Mono', monospace;
            --font-body: 'Share Tech Mono', monospace;
            --radius-main: 0px;
            --radius-btn: 0px;
            --glow-pri: 0px 0px 10px rgba(0, 255, 65, 0.4);
            --bg-pattern: none;
        }

        /* Essential Theme System Bindings */
        body {
            background-color: var(--bg-main);
            background-image: var(--bg-pattern);
            background-size: 30px 30px;
            transition: background-color 0.4s ease, background-image 0.4s ease;
        }

        .chat-scroll::-webkit-scrollbar { width: 4px; }
        .chat-scroll::-webkit-scrollbar-track { background: transparent; }
        .chat-scroll::-webkit-scrollbar-thumb { background-color: var(--pri); }

        /* Cyberpunk Decorative Elements */
        .theme-deco { display: none; }
        .theme-cyber .theme-deco, .theme-hacker .theme-deco { display: block; }
        
        .cyber-clip { clip-path: none; }
        .theme-cyber .cyber-clip, .theme-hacker .cyber-clip {
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
        }
        
        .cyber-clip-sm { clip-path: none; }
        .theme-cyber .cyber-clip-sm, .theme-hacker .cyber-clip-sm {
            clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
        }

        /* Message Entry Glow Animation */
        @keyframes entryGlow {
            0% { opacity: 0.3; border-color: var(--sec); }
            50% { opacity: 1; border-color: var(--pri); }
            100% { opacity: 1; }
        }
        .msg-arrival {
            animation: entryGlow 0.4s ease-out;
        }

        /* Message action container trigger handling visibility elements */
        .msg-container-box:hover .msg-action-trigger {
            opacity: 1;
        }
    </style>

    <script>
        // Dynamic CSS variables mapping inside Tailwind CSS configuration
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        thm: {
                            main: 'var(--bg-main)',
                            panel: 'var(--bg-panel)',
                            input: 'var(--bg-input)',
                            txt: 'var(--text-main)',
                            mut: 'var(--text-mut)',
                            pri: 'var(--pri)',
                            priHov: 'var(--pri-hover)',
                            sec: 'var(--sec)',
                            bdr: 'var(--bdr)',
                            mBg: 'var(--msg-me-bg)',
                            mBdr: 'var(--msg-me-bdr)',
                            mTxt: 'var(--msg-me-txt)',
                            oBg: 'var(--msg-oth-bg)',
                            oBdr: 'var(--msg-oth-bdr)',
                            oTxt: 'var(--msg-oth-txt)',
                        }
                    },
                    fontFamily: {
                        head: 'var(--font-head)',
                        body: 'var(--font-body)',
                    },
                    borderRadius: {
                        main: 'var(--radius-main)',
                        btn: 'var(--radius-btn)',
                    },
                    boxShadow: { glow: 'var(--glow-pri)' }
                }
            }
        }
    </script>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration

        const defaultFirebaseConfig = {
          apiKey: "AIzaSyA3zCxlycuQpUI_IqqevZHfFskCiiCCUVo",
          authDomain: "my-chat-app-a2010.firebaseapp.com",
          projectId: "my-chat-app-a2010",
          storageBucket: "my-chat-app-a2010.firebasestorage.app",
          messagingSenderId: "397957848183",
          appId: "1:397957848183:web:01cacbb79a025897e63a72",
          measurementId: "G-JRFS8DMZP0"
        };

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : defaultFirebaseConfig;
        
        // BUG FIX: Replacing any slashes in __app_id with underscores so the Firestore path stays intact.
        const rawAppId = typeof __app_id !== 'undefined' ? __app_id : 'guptlok-default-id';
        const appId = rawAppId.replace(/\//g, '_');

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // UI Interfaces Mapping
        const loginBtn = document.getElementById('login-submit-btn');
        const usernameModal = document.getElementById('username-modal');
        const usernameForm = document.getElementById('username-form');
        const usernameInput = document.getElementById('username-input');
        const chatLayout = document.getElementById('chat-layout');
        const displayName = document.getElementById('display-name');
        
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const container = document.getElementById('messages-container');
        const transmissionSpeed = document.getElementById('transmission-speed');

        const sidebarPanel = document.getElementById('sidebar-panel');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const mobileToggle = document.getElementById('mobile-sidebar-toggle');

        const editModal = document.getElementById('edit-modal');
        const editMessageInput = document.getElementById('edit-message-input');
        const saveEditBtn = document.getElementById('save-edit-btn');

        let myUsername = "";
        let currentlyEditingDocId = "";

        async function startApp() {
            try {
                await signInAnonymously(auth);
                loginBtn.textContent = "INITIALIZE NETWORK";
                loginBtn.disabled = false;
                loginBtn.classList.remove('opacity-50');
                loginBtn.classList.add('hover:bg-thm-priHov');
                setupRealtimeSync();
            } catch (error) {
                console.error("Database connection failed, using local mode:", error);
                loginBtn.textContent = "INITIALIZE LOCAL_PORT";
                loginBtn.disabled = false;
                loginBtn.classList.remove('opacity-50');
            }
        }

        startApp();

        function toggleMobileSidebar() {
            sidebarPanel.classList.toggle('-translate-x-full');
            sidebarOverlay.classList.toggle('hidden');
        }
        if (mobileToggle) mobileToggle.addEventListener('click', toggleMobileSidebar);
        if (sidebarOverlay) sidebarOverlay.addEventListener('click', toggleMobileSidebar);

        usernameForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const inputName = usernameInput.value.trim().toUpperCase();
            if (inputName) {
                myUsername = inputName;
                displayName.textContent = myUsername;
                usernameModal.classList.add('hidden');
                chatLayout.classList.remove('hidden');
            }
        });

        chatForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (text && auth.currentUser) {
                messageInput.value = '';

                if (transmissionSpeed) {
                    transmissionSpeed.classList.add('text-thm-pri', 'animate-ping');
                    setTimeout(() => {
                        transmissionSpeed.classList.remove('text-thm-pri', 'animate-ping');
                    }, 500);
                }

                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), {
                        username: myUsername,
                        text: text,
                        timestamp: Date.now(), 
                        formattedTime: new Date().toLocaleTimeString('en-IN', {
                            timeZone: 'Asia/Kolkata',
                            hour: '2-digit',
                            minute: '2-digit',
                            second: '2-digit',
                            hour12: false
                        }),
                        edited: false
                    });
                } catch (error) {
                    console.error("Failed to transmit packet:", error);
                }
            }
        });

        function setupRealtimeSync() {
            const queryCollection = collection(db, 'artifacts', appId, 'public', 'data', 'messages');
            
            onSnapshot(queryCollection, (snapshot) => {
                const messagesList = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    data.id = doc.id;
                    messagesList.push(data);
                });

                messagesList.sort((a, b) => a.timestamp - b.timestamp);

                container.innerHTML = '';
                messagesList.forEach(msg => appendMessageElement(msg));
                container.scrollTop = container.scrollHeight;
            }, (error) => {
                console.error("Database sync error:", error);
            });
        }

        function appendMessageElement(data) {
            const isMe = data.username === myUsername;
            const alignment = isMe ? 'justify-end' : 'justify-start';
            
            const bubbleStyle = isMe 
                ? "bg-thm-mBg border border-thm-mBdr text-thm-mTxt shadow-glow rounded-main rounded-tr-none" 
                : "bg-thm-oBg border border-thm-oBdr text-thm-oTxt rounded-main rounded-tl-none";
            
            const label = isMe ? 'YOU' : data.username;
            const glowText = isMe ? 'text-thm-pri' : 'text-thm-sec';

            const actionButtonsHtml = isMe ? `
                <div class="msg-action-trigger opacity-0 flex items-center gap-2.5 ml-2 transition-opacity duration-200">
                    <button onclick="openEditModal('${data.id}', '${escapeHtml(data.text).replace(/'/g, "\\'")}')" class="text-thm-mut hover:text-[#00D9FF] text-xs transition-colors" title="Edit message">
                        <i class="fa-solid fa-pen-to-square"></i>
                    </button>
                    <button onclick="deleteMessage('${data.id}')" class="text-thm-mut hover:text-red-500 text-xs transition-colors" title="Delete message">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            ` : '';

            const msgHtml = `
                <div class="flex ${alignment} items-end px-1 mb-2 msg-arrival msg-container-box group">
                    <div class="max-w-[85%] md:max-w-[70%] relative">
                        <div class="flex items-center justify-between">
                            <span class="text-[9px] font-bold ${glowText} tracking-widest block mb-1.5 ml-1 font-head uppercase">${label}</span>
                            ${actionButtonsHtml}
                        </div>
                        <div class="${bubbleStyle} px-4 py-3 text-xs md:text-sm break-words transition-colors duration-300 relative cyber-clip-sm">
                            <div class="theme-deco absolute top-0 right-0 w-2.5 h-2.5 ${isMe ? 'bg-thm-pri shadow-glow' : 'bg-thm-sec'}"></div>
                            ${escapeHtml(data.text)}
                        </div>
                        <span class="text-[8px] text-thm-mut font-bold block mt-1.5 mx-1 font-mono uppercase tracking-widest ${isMe ? 'text-right' : ''}">
                            TIMESTAMP: ${data.formattedTime} ${data.edited ? '<span class="text-thm-pri ml-1 animate-pulse">(EDITED)</span>' : ''}
                        </span>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', msgHtml);
        }

        window.openEditModal = function(id, text) {
            currentlyEditingDocId = id;
            editMessageInput.value = text;
            editModal.classList.remove('hidden');
            editModal.classList.add('flex');
            setTimeout(() => editMessageInput.focus(), 50);
        };

        window.closeEditModal = function() {
            editModal.classList.add('hidden');
            editModal.classList.remove('flex');
            currentlyEditingDocId = "";
        };

        saveEditBtn.addEventListener('click', async function() {
            const updatedText = editMessageInput.value.trim();
            if (updatedText && currentlyEditingDocId && auth.currentUser) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'messages', currentlyEditingDocId);
                    await updateDoc(docRef, {
                        text: updatedText,
                        edited: true
                    });
                    closeEditModal();
                } catch (error) {
                    console.error("Failed to edit secure packet:", error);
                }
            }
        });

        window.deleteMessage = async function(id) {
            if (id && auth.currentUser) {
                const confirmation = confirm("Are you sure you want to delete this message packet?");
                if (confirmation) {
                    try {
                        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'messages', id);
                        await deleteDoc(docRef);
                    } catch (error) {
                        console.error("Failed to delete packet:", error);
                    }
                }
            }
        };

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
    <script>
        // --- MULTI-THEME ENGINE CONTROLLER ---
        function setTheme(themeName) {
            document.body.className = `text-thm-txt min-h-screen flex flex-col antialiased relative font-body overflow-hidden transition-colors duration-500 ${themeName}`;
            localStorage.setItem('guptlok-theme', themeName);
        }

        const savedTheme = localStorage.getItem('guptlok-theme') || 'theme-cyber';
        setTheme(savedTheme);

        const dropdownBtn = document.getElementById('theme-dropdown-btn');
        const dropdownMenu = document.getElementById('theme-dropdown-menu');
        const loginDropdownBtn = document.getElementById('login-theme-dropdown-btn');
        const loginDropdownMenu = document.getElementById('login-theme-dropdown-menu');

        function toggleThemeDropdown() {
            dropdownMenu.classList.toggle('hidden');
        }

        function toggleLoginThemeDropdown() {
            loginDropdownMenu.classList.toggle('hidden');
        }

        if (dropdownBtn) {
            dropdownBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleThemeDropdown();
            });
        }

        if (loginDropdownBtn) {
            loginDropdownBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleLoginThemeDropdown();
            });
        }

        document.addEventListener('click', function() {
            if (dropdownMenu && !dropdownMenu.classList.contains('hidden')) {
                dropdownMenu.classList.add('hidden');
            }
            if (loginDropdownMenu && !loginDropdownMenu.classList.contains('hidden')) {
                loginDropdownMenu.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
