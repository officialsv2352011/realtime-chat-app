<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUPTLOK // SECURE-CHAT</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Web Fonts for All Themes -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           DYNAMIC THEME VARIABLES (CSS ENGINE)
           ========================================= */
        :root {
            --bg-pattern: none;
        }

        /* 🔵 THEME 1: NORMAL (Modern Dark Mode) */
        .theme-normal {
            --bg-main: #0f172a;        /* slate-900 */
            --bg-panel: #1e293b;       /* slate-800 */
            --bg-input: #0f172a;
            --text-main: #f8fafc;
            --text-mut: #94a3b8;
            --pri: #6366f1;            /* indigo-500 */
            --pri-hover: #4f46e5;
            --sec: #8b5cf6;            /* violet-500 */
            --bdr: #334155;            /* slate-700 */
            --msg-me-bg: #4f46e5;
            --msg-me-bdr: #4f46e5;
            --msg-me-txt: #ffffff;
            --msg-oth-bg: #1e293b;
            --msg-oth-bdr: #334155;
            --msg-oth-txt: #f8fafc;
            --font-head: 'Inter', sans-serif;
            --font-body: 'Inter', sans-serif;
            --radius-main: 1rem;
            --radius-btn: 0.75rem;
            --glow-pri: 0 4px 10px rgba(99, 102, 241, 0.3);
            --bg-pattern: none;
        }

        /* 🤖 THEME 2: CYBER (Deep Cyber-Blue Neon) */
        .theme-cyber {
            --bg-main: #0B1020;        /* Requested Background */
            --bg-panel: #111827;       /* Requested Card Color */
            --bg-input: #0B1020;
            --text-main: #E2E8F0;      /* Requested Text Color */
            --text-mut: rgba(226, 232, 240, 0.5);
            --pri: #00D9FF;            /* Requested Neon Blue */
            --pri-hover: #2563EB;      /* Requested Secondary Blue */
            --sec: #2563EB;
            --bdr: rgba(0, 217, 255, 0.4);
            --msg-me-bg: #111827;
            --msg-me-bdr: #00D9FF;
            --msg-me-txt: #E2E8F0;
            --msg-oth-bg: #111827;
            --msg-oth-bdr: #2563EB;
            --msg-oth-txt: #E2E8F0;
            --font-head: 'Orbitron', sans-serif;
            --font-body: 'Share Tech Mono', monospace;
            --radius-main: 0px;
            --radius-btn: 0px;
            --glow-pri: 0px 0px 15px rgba(0, 217, 255, 0.3);
            --bg-pattern: linear-gradient(rgba(0, 217, 255, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 217, 255, 0.04) 1px, transparent 1px);
        }

        /* 👨‍💻 THEME 3: HACKER (Matrix Green Terminal) */
        .theme-hacker {
            --bg-main: #000000;
            --bg-panel: #050505;
            --bg-input: #000000;
            --text-main: #00FF41;
            --text-mut: #008F11;
            --pri: #00FF41;
            --pri-hover: #008F11;
            --sec: #008F11;
            --bdr: #00FF41;
            --msg-me-bg: #000000;
            --msg-me-bdr: #00FF41;
            --msg-me-txt: #00FF41;
            --msg-oth-bg: #050505;
            --msg-oth-bdr: #008F11;
            --msg-oth-txt: #00FF41;
            --font-head: 'Share Tech Mono', monospace;
            --font-body: 'Share Tech Mono', monospace;
            --radius-main: 0px;
            --radius-btn: 0px;
            --glow-pri: 0px 0px 10px rgba(0, 255, 65, 0.4);
            --bg-pattern: none;
        }

        /* Essential Theme System Bindings */
        body {
            background-color: var(--bg-main);
            background-image: var(--bg-pattern);
            background-size: 30px 30px;
            transition: background-color 0.4s ease, background-image 0.4s ease;
        }

        .chat-scroll::-webkit-scrollbar { width: 4px; }
        .chat-scroll::-webkit-scrollbar-track { background: transparent; }
        .chat-scroll::-webkit-scrollbar-thumb { background-color: var(--pri); }

        /* Cyberpunk Decorative Elements (Only shown on Cyber/Hacker) */
        .theme-deco { display: none; }
        .theme-cyber .theme-deco, .theme-hacker .theme-deco { display: block; }
        
        .cyber-clip { clip-path: none; }
        .theme-cyber .cyber-clip, .theme-hacker .cyber-clip {
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
        }
        
        .cyber-clip-sm { clip-path: none; }
        .theme-cyber .cyber-clip-sm, .theme-hacker .cyber-clip-sm {
            clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
        }

        /* Message Entry Glow Animation */
        @keyframes entryGlow {
            0% { opacity: 0.3; border-color: var(--sec); }
            50% { opacity: 1; border-color: var(--pri); }
            100% { opacity: 1; }
        }
        .msg-arrival {
            animation: entryGlow 0.4s ease-out;
        }
    </style>

    <script>
        // Dynamic CSS variables mapping inside Tailwind CSS configuration
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        thm: {
                            main: 'var(--bg-main)',
                            panel: 'var(--bg-panel)',
                            input: 'var(--bg-input)',
                            txt: 'var(--text-main)',
                            mut: 'var(--text-mut)',
                            pri: 'var(--pri)',
                            priHov: 'var(--pri-hover)',
                            sec: 'var(--sec)',
                            bdr: 'var(--bdr)',
                            mBg: 'var(--msg-me-bg)',
                            mBdr: 'var(--msg-me-bdr)',
                            mTxt: 'var(--msg-me-txt)',
                            oBg: 'var(--msg-oth-bg)',
                            oBdr: 'var(--msg-oth-bdr)',
                            oTxt: 'var(--msg-oth-txt)',
                        }
                    },
                    fontFamily: {
                        head: 'var(--font-head)',
                        body: 'var(--font-body)',
                    },
                    borderRadius: {
                        main: 'var(--radius-main)',
                        btn: 'var(--radius-btn)',
                    },
                    boxShadow: { glow: 'var(--glow-pri)' }
                }
            }
        }
    </script>
</head>

    <!-- Active System Engine Socket Management Scripts -->
    <!-- Actual server socket.io loading script placed first -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Dynamic Fallback Guard for Socket.io (Runs ONLY if real script above failed to load/404)
        if (typeof io === 'undefined') {
            console.log("Offline preview mode fallback active...");
            window.io = function() {
                const listeners = {};
                return {
                    on: function(event, callback) {
                        listeners[event] = callback;
                    },
                    emit: function(event, data) {
                        console.log("Mock emitted:", event, data);
                        if (event === 'chat message') {
                            // Simulate local echo after a small delay
                            const self = this;
                            setTimeout(() => {
                                if (listeners['chat message']) {
                                    listeners['chat message']({
                                        username: myUsername || "ANONYMOUS",
                                        text: data,
                                        timestamp: new Date().toLocaleTimeString('en-IN', {
                                            hour: '2-digit',
                                            minute: '2-digit',
                                            second: '2-digit',
                                            hour12: false
                                        })
                                    });
                                }
                            }, 100);
                        }
                    }
                };
            };
        }
    </script>
    <script>
        // --- MULTI-THEME ENGINE CONTROLLER ---
        function setTheme(themeName) {
            document.body.className = `text-thm-txt min-h-screen flex flex-col antialiased relative font-body overflow-hidden transition-colors duration-500 ${themeName}`;
            localStorage.setItem('guptlok-theme', themeName);
        }

        // Initialize user preferred session theme layout on start
        const savedTheme = localStorage.getItem('guptlok-theme') || 'theme-cyber';
        setTheme(savedTheme);

        // --- TOP-RIGHT DROPDOWNS HANDLERS ---
        const dropdownBtn = document.getElementById('theme-dropdown-btn');
        const dropdownMenu = document.getElementById('theme-dropdown-menu');
        const loginDropdownBtn = document.getElementById('login-theme-dropdown-btn');
        const loginDropdownMenu = document.getElementById('login-theme-dropdown-menu');

        function toggleThemeDropdown() {
            dropdownMenu.classList.toggle('hidden');
        }

        function toggleLoginThemeDropdown() {
            loginDropdownMenu.classList.toggle('hidden');
        }

        if (dropdownBtn) {
            dropdownBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleThemeDropdown();
            });
        }

        if (loginDropdownBtn) {
            loginDropdownBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleLoginThemeDropdown();
            });
        }

        // Close dropdowns when clicking anywhere else
        document.addEventListener('click', function() {
            if (dropdownMenu && !dropdownMenu.classList.contains('hidden')) {
                dropdownMenu.classList.add('hidden');
            }
            if (loginDropdownMenu && !loginDropdownMenu.classList.contains('hidden')) {
                loginDropdownMenu.classList.add('hidden');
            }
        });

        // --- CORE SOCKET COMMUNICATOR ENGINE ---
        const socket = io();
        let myUsername = "";

        const usernameModal = document.getElementById('username-modal');
        const usernameForm = document.getElementById('username-form');
        const usernameInput = document.getElementById('username-input');
        const chatLayout = document.getElementById('chat-layout');
        const displayName = document.getElementById('display-name');
        
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const container = document.getElementById('messages-container');
        const usersListContainer = document.getElementById('active-users-list');
        const userCountBadge = document.getElementById('user-count-badge');

        const sidebarPanel = document.getElementById('sidebar-panel');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const mobileToggle = document.getElementById('mobile-sidebar-toggle');
        const transmissionSpeed = document.getElementById('transmission-speed');

        function toggleMobileSidebar() {
            sidebarPanel.classList.toggle('-translate-x-full');
            sidebarOverlay.classList.toggle('hidden');
        }
        mobileToggle.addEventListener('click', toggleMobileSidebar);
        sidebarOverlay.addEventListener('click', toggleMobileSidebar);

        usernameForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const inputName = usernameInput.value.trim().toUpperCase();
            if (inputName) {
                myUsername = inputName;
                displayName.textContent = myUsername;
                usernameModal.classList.add('hidden');
                chatLayout.classList.remove('hidden');
                socket.emit('store username', myUsername);
            }
        });

        chatForm.addEventListener('submit', function(e) {
            e.preventDefault();
            if (messageInput.value.trim()) {
                socket.emit('chat message', messageInput.value);

                // Active transmission status link animation blink trigger feedback
                if (transmissionSpeed) {
                    transmissionSpeed.classList.add('text-thm-pri', 'animate-ping');
                    setTimeout(() => {
                        transmissionSpeed.classList.remove('text-thm-pri', 'animate-ping');
                    }, 500);
                }

                messageInput.value = '';
            }
        });

        function appendMessageElement(data) {
            const isMe = data.username === myUsername;
            const alignment = isMe ? 'justify-end' : 'justify-start';
            
            // Core dynamic class variable resolver for multi-theme integration 
            const bubbleStyle = isMe 
                ? "bg-thm-mBg border-2 border-thm-mBdr text-thm-mTxt shadow-glow rounded-main rounded-tr-none" 
                : "bg-thm-oBg border-2 border-thm-oBdr text-thm-oTxt rounded-main rounded-tl-none";
            
            const label = isMe ? 'YOU' : data.username;
            const glowText = isMe ? 'text-thm-pri' : 'text-thm-sec';

            const msgHtml = `
                <div class="flex ${alignment} items-end px-1 mb-2 msg-arrival">
                    <div class="max-w-[85%] md:max-w-[70%] relative">
                        <span class="text-[9px] font-bold ${glowText} tracking-widest block mb-1.5 ml-1 font-head uppercase">${label}</span>
                        <div class="${bubbleStyle} px-4 py-3 text-xs md:text-sm break-words transition-colors duration-300 relative cyber-clip-sm">
                            <div class="theme-deco absolute top-0 right-0 w-2.5 h-2.5 ${isMe ? 'bg-thm-pri shadow-glow' : 'bg-thm-sec'}"></div>
                            ${escapeHtml(data.text)}
                        </div>
                        <span class="text-[8px] text-thm-mut font-bold block mt-1.5 mx-1 font-mono uppercase tracking-widest ${isMe ? 'text-right' : ''}">TIMESTAMP: ${data.timestamp}</span>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', msgHtml);
        }

        socket.on('chat message', function(data) {
            appendMessageElement(data);
            container.scrollTop = container.scrollHeight;
        });

        socket.on('load history', function(historyArray) {
            container.innerHTML = '';
            historyArray.forEach(msg => appendMessageElement(msg));
            container.scrollTop = container.scrollHeight;
        });

        socket.on('update user list', function(activeUsernamesArray) {
            usersListContainer.innerHTML = ''; 
            userCountBadge.textContent = `${activeUsernamesArray.length}`;

            activeUsernamesArray.forEach(username => {
                const isMe = username === myUsername;
                const activeHtml = `
                    <div class="flex items-center justify-between py-2.5 px-3 bg-thm-panel border ${isMe ? 'border-thm-pri shadow-glow' : 'border-thm-bdr/50'} rounded-btn transition-colors duration-300">
                        <div class="flex items-center space-x-2.5 min-w-0">
                            <span class="w-2 h-2 rounded-full ${isMe ? 'bg-thm-pri shadow-glow' : 'bg-[#2563EB]'}"></span>
                            <h4 class="text-xs font-bold truncate tracking-wider font-head ${isMe ? 'text-thm-pri' : 'text-thm-txt'}">
                                ${username} ${isMe ? '<span class="text-[8px] text-[#2563EB] font-mono ml-1">_LOCAL</span>' : ''}
                            </h4>
                        </div>
                    </div>
                `;
                usersListContainer.insertAdjacentHTML('beforeend', activeHtml);
            });
        });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
