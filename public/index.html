<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuptLok Chat Lounge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .chat-scroll::-webkit-scrollbar { width: 4px; }
        .chat-scroll::-webkit-scrollbar-track { background: transparent; }
        .chat-scroll::-webkit-scrollbar-thumb { background-color: rgba(99, 102, 241, 0.2); border-radius: 20px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased relative font-sans select-none">

    <div id="username-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-xl z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900/60 border border-slate-800/80 p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center backdrop-blur-md">
            <div class="bg-gradient-to-tr from-indigo-600 to-violet-500 w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-xl shadow-indigo-500/20">
                <i class="fa-solid fa-user-shield text-white text-2xl"></i>
            </div>
            <h3 class="text-xl font-extrabold text-white tracking-tight mb-2">Identify Yourself</h3>
            <p class="text-xs text-slate-400 mb-6">Enter a secret alias to join the dynamic lounge</p>
            <form id="username-form" class="space-y-4">
                <input 
                    id="username-input"
                    type="text" 
                    required 
                    maxlength="15"
                    placeholder="Enter nickname..." 
                    class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-100 text-center font-medium placeholder-slate-600 transition-all"
                />
                <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold py-3 rounded-2xl transition-all shadow-lg shadow-indigo-600/20 active:scale-[0.98]">
                    Enter GuptLok
                </button>
            </form>
        </div>
    </div>

    <div id="chat-layout" class="hidden flex flex-col h-screen overflow-hidden">
        
        <header class="bg-slate-900/40 border-b border-slate-900 px-4 md:px-6 py-4 flex items-center justify-between shadow-sm h-20 shrink-0 backdrop-blur-md z-10 relative">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-br from-indigo-600 to-violet-600 p-2.5 rounded-xl flex items-center justify-center shadow-md shadow-indigo-600/10">
                    <i class="fa-solid fa-bolt text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="font-black text-base md:text-lg tracking-tight text-white flex items-center gap-1.5">
                        GuptLok <span class="text-xs font-medium text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded-md border border-indigo-500/10">v2.0</span>
                    </h1>
                    <p class="text-[11px] text-slate-400 flex items-center mt-0.5">
                        <span class="h-1.5 w-1.5 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span>
                        Alias: <span id="display-name" class="font-bold text-slate-200 ml-1"></span>
                    </p>
                </div>
            </div>

            <button id="mobile-sidebar-toggle" class="md:hidden bg-slate-900 border border-slate-800 text-slate-300 p-2.5 rounded-xl hover:text-white transition-all active:scale-95">
                <i class="fa-solid fa-users text-sm"></i>
            </button>
        </header>

        <main class="flex-grow flex w-full mx-auto relative h-[calc(100vh-80px)] overflow-hidden">
            
            <section id="sidebar-panel" class="w-64 bg-slate-950 border-r border-slate-900 flex flex-col absolute md:static inset-y-0 left-0 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out z-20 md:z-0 shrink-0 h-full">
                <div class="p-5 border-b border-slate-900 flex items-center justify-between shrink-0 bg-slate-950">
                    <h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-500 flex items-center justify-between w-full">
                        <span>Active Network</span>
                        <span id="user-count-badge" class="bg-indigo-500/10 text-indigo-400 px-2 py-0.5 rounded-md text-[10px] border border-indigo-500/10 font-bold">0 online</span>
                    </h3>
                </div>
                <div id="active-users-list" class="flex-1 p-4 overflow-y-auto chat-scroll space-y-2 bg-slate-950"></div>
            </section>

            <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-15 hidden md:hidden"></div>

            <section class="flex-1 bg-slate-900/10 flex flex-col overflow-hidden h-full relative">
                <div id="messages-container" class="flex-1 p-4 md:p-6 overflow-y-auto chat-scroll space-y-4 bg-gradient-to-b from-slate-950 to-slate-900/20"></div>

                <form id="chat-form" class="p-4 bg-slate-950/80 border-t border-slate-900/60 flex items-center gap-2.5 shrink-0 backdrop-blur-md">
                    <input 
                        id="message-input"
                        type="text" 
                        autocomplete="off" 
                        placeholder="Type a secure message..." 
                        class="flex-1 bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/80 text-slate-100 placeholder-slate-600 transition-all shadow-inner"
                    />
                    <button type="submit" class="bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white p-3.5 rounded-xl flex items-center justify-center aspect-square transition-all shadow-md shadow-indigo-600/10 active:scale-95 shrink-0">
                        <i class="fa-solid fa-paper-plane text-xs md:text-sm"></i>
                    </button>
                </form>
            </section>

        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myUsername = "";

        // UI Interfaces Mapping
        const usernameModal = document.getElementById('username-modal');
        const usernameForm = document.getElementById('username-form');
        const usernameInput = document.getElementById('username-input');
        const chatLayout = document.getElementById('chat-layout');
        const displayName = document.getElementById('display-name');
        
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const container = document.getElementById('messages-container');
        const usersListContainer = document.getElementById('active-users-list');
        const userCountBadge = document.getElementById('user-count-badge');

        const sidebarPanel = document.getElementById('sidebar-panel');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const mobileToggle = document.getElementById('mobile-sidebar-toggle');

        // Mobile Sidebar Mechanism Control Drawer
        function toggleMobileSidebar() {
            sidebarPanel.classList.toggle('-translate-x-full');
            sidebarOverlay.classList.toggle('hidden');
        }
        mobileToggle.addEventListener('click', toggleMobileSidebar);
        sidebarOverlay.addEventListener('click', toggleMobileSidebar);

        usernameForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const inputName = usernameInput.value.trim();
            if (inputName) {
                myUsername = inputName;
                displayName.textContent = myUsername;
                usernameModal.classList.add('hidden');
                chatLayout.classList.remove('hidden');
                socket.emit('store username', myUsername);
            }
        });

        chatForm.addEventListener('submit', function(e) {
            e.preventDefault();
            if (messageInput.value.trim()) {
                socket.emit('chat message', messageInput.value);
                messageInput.value = '';
            }
        });

        function appendMessageElement(data) {
            const isMe = data.username === myUsername;
            const alignment = isMe ? 'justify-end' : 'justify-start';
            
            // Premium Glassmorphism styling blocks
            const bubbleStyle = isMe 
                ? "bg-gradient-to-br from-indigo-600 to-indigo-700 text-white border-indigo-500/30 rounded-2xl rounded-tr-none shadow-md shadow-indigo-600/10" 
                : "bg-slate-900 border-slate-800/80 text-slate-100 rounded-2xl rounded-tl-none shadow-sm shadow-black/10";
            
            const label = isMe ? 'You' : data.username;

            const msgHtml = `
                <div class="flex ${alignment} items-end animate-fade-in px-1">
                    <div class="max-w-[85%] md:max-w-[70%]">
                        ${!isMe ? `<span class="text-[10px] font-bold text-indigo-400/90 tracking-wide block mb-1 ml-1">${label}</span>` : ''}
                        <div class="${bubbleStyle} px-4 py-3 text-xs md:text-sm break-words border leading-relaxed">
                            ${escapeHtml(data.text)}
                        </div>
                        <span class="text-[9px] text-slate-500 font-medium block mt-1 mx-1 ${isMe ? 'text-right' : ''}">${data.timestamp}</span>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', msgHtml);
        }

        socket.on('chat message', function(data) {
            appendMessageElement(data);
            container.scrollTop = container.scrollHeight;
        });

        socket.on('load history', function(historyArray) {
            container.innerHTML = '';
            historyArray.forEach(msg => appendMessageElement(msg));
            container.scrollTop = container.scrollHeight;
        });

        socket.on('update user list', function(activeUsernamesArray) {
            usersListContainer.innerHTML = ''; 
            userCountBadge.textContent = `${activeUsernamesArray.length} online`;

            activeUsernamesArray.forEach(username => {
                const isMe = username === myUsername;
                const activeHtml = `
                    <div class="flex items-center justify-between py-2.5 px-3 rounded-xl bg-slate-900/30 border border-slate-900/40 hover:border-slate-800/40 transition-all duration-200">
                        <div class="flex items-center space-x-2.5 min-w-0">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 shadow-sm shadow-emerald-400"></span>
                            <h4 class="text-xs font-semibold truncate ${isMe ? 'text-indigo-400' : 'text-slate-300'}">
                                ${username} ${isMe ? '<span class="text-[10px] opacity-60 font-normal ml-0.5">(You)</span>' : ''}
                            </h4>
                        </div>
                    </div>
                `;
                usersListContainer.insertAdjacentHTML('beforeend', activeHtml);
            });
        });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
