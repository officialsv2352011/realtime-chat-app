<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>GUPTLOK // PREMIUM-SECURE-CHAT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           DYNAMIC THEME VARIABLES (CSS ENGINE)
           ========================================= */
        :root {
            --bg-pattern: none;
        }

        /* THEME 1: NORMAL (Modern Dark Mode) */
        .theme-normal {
            --bg-main: #0f172a;
            --bg-panel: #1e293b;
            --bg-input: #0f172a;
            --text-main: #f8fafc;
            --text-mut: #94a3b8;
            --pri: #6366f1;
            --pri-hover: #4f46e5;
            --sec: #8b5cf6;
            --bdr: #334155;
            --msg-me-bg: #4f46e5;
            --msg-me-bdr: #4f46e5;
            --msg-me-txt: #ffffff;
            --msg-oth-bg: #1e293b;
            --msg-oth-bdr: #334155;
            --msg-oth-txt: #f8fafc;
            --font-head: 'Inter', sans-serif;
            --font-body: 'Inter', sans-serif;
            --radius-main: 1rem;
            --radius-btn: 0.75rem;
            --glow-pri: 0 4px 10px rgba(99, 102, 241, 0.3);
            --bg-pattern: none;
        }

        /* THEME 2: CYBER (Deep Cyber-Blue Neon) */
        .theme-cyber {
            --bg-main: #0B1020;
            --bg-panel: #111827;
            --bg-input: #0B1020;
            --text-main: #E2E8F0;
            --text-mut: rgba(226, 232, 240, 0.5);
            --pri: #00D9FF;
            --pri-hover: #2563EB;
            --sec: #2563EB;
            --bdr: rgba(0, 217, 255, 0.4);
            --msg-me-bg: #111827;
            --msg-me-bdr: #00D9FF;
            --msg-me-txt: #E2E8F0;
            --msg-oth-bg: #111827;
            --msg-oth-bdr: #2563EB;
            --msg-oth-txt: #E2E8F0;
            --font-head: 'Orbitron', sans-serif;
            --font-body: 'Share Tech Mono', monospace;
            --radius-main: 0px;
            --radius-btn: 0px;
            --glow-pri: 0px 0px 15px rgba(0, 217, 255, 0.3);
            --bg-pattern: linear-gradient(rgba(0, 217, 255, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 217, 255, 0.04) 1px, transparent 1px);
        }

        /* THEME 3: HACKER (Matrix Green Terminal) */
        .theme-hacker {
            --bg-main: #000000;
            --bg-panel: #050505;
            --bg-input: #000000;
            --text-main: #00FF41;
            --text-mut: #008F11;
            --pri: #00FF41;
            --pri-hover: #008F11;
            --sec: #008F11;
            --bdr: #00FF41;
            --msg-me-bg: #000000;
            --msg-me-bdr: #00FF41;
            --msg-me-txt: #00FF41;
            --msg-oth-bg: #050505;
            --msg-oth-bdr: #008F11;
            --msg-oth-txt: #00FF41;
            --font-head: 'Share Tech Mono', monospace;
            --font-body: 'Share Tech Mono', monospace;
            --radius-main: 0px;
            --radius-btn: 0px;
            --glow-pri: 0px 0px 10px rgba(0, 255, 65, 0.4);
            --bg-pattern: none;
        }

        #chat-layout {
            height: 100vh;
            height: 100dvh;
        }

        body {
            background-color: var(--bg-main);
            background-image: var(--bg-pattern);
            background-size: 30px 30px;
            transition: background-color 0.4s ease, background-image 0.4s ease;
        }

        .chat-scroll::-webkit-scrollbar { width: 4px; }
        .chat-scroll::-webkit-scrollbar-track { background: transparent; }
        .chat-scroll::-webkit-scrollbar-thumb { background-color: var(--pri); }

        .theme-deco { display: none; }
        .theme-cyber .theme-deco, .theme-hacker .theme-deco { display: block; }
        
        .cyber-clip { clip-path: none; }
        .theme-cyber .cyber-clip, .theme-hacker .cyber-clip {
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
        }
        
        .cyber-clip-sm { clip-path: none; }
        .theme-cyber .cyber-clip-sm, .theme-hacker .cyber-clip-sm {
            clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
        }

        @keyframes entryGlow {
            0% { opacity: 0; transform: translateY(10px); filter: brightness(1.5); }
            100% { opacity: 1; transform: translateY(0); filter: brightness(1); }
        }
        .msg-arrival {
            animation: entryGlow 0.3s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
        }

        .msg-container-box:hover .msg-action-trigger { opacity: 1; }

        @media (max-width: 768px) {
            .msg-action-trigger { opacity: 1 !important; }
        }

        .blink-fast { animation: blink 0.8s infinite steps(2, start); }
        @keyframes blink { to { visibility: hidden; } }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        thm: {
                            main: 'var(--bg-main)',
                            panel: 'var(--bg-panel)',
                            input: 'var(--bg-input)',
                            txt: 'var(--text-main)',
                            mut: 'var(--text-mut)',
                            pri: 'var(--pri)',
                            priHov: 'var(--pri-hover)',
                            sec: 'var(--sec)',
                            bdr: 'var(--bdr)',
                            mBg: 'var(--msg-me-bg)',
                            mBdr: 'var(--msg-me-bdr)',
                            mTxt: 'var(--msg-me-txt)',
                            oBg: 'var(--msg-oth-bg)',
                            oBdr: 'var(--msg-oth-bdr)',
                            oTxt: 'var(--msg-oth-txt)',
                        }
                    },
                    fontFamily: { head: 'var(--font-head)', body: 'var(--font-body)' },
                    borderRadius: { main: 'var(--radius-main)', btn: 'var(--radius-btn)' },
                    boxShadow: { glow: 'var(--glow-pri)' }
                }
            }
        }
    </script>
</head>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        if (typeof io === 'undefined') {
            window.io = function() { return { on: function(){}, emit: function(){} }; };
        }
    </script>
    <script>
        function setTheme(themeName) {
            document.body.className = `text-thm-txt min-h-screen flex flex-col antialiased relative font-body overflow-hidden transition-colors duration-500 ${themeName}`;
            localStorage.setItem('guptlok-theme', themeName);
        }
        setTheme(localStorage.getItem('guptlok-theme') || 'theme-cyber');

        const dropdownBtn = document.getElementById('theme-dropdown-btn');
        const dropdownMenu = document.getElementById('theme-dropdown-menu');
        const loginDropdownBtn = document.getElementById('login-theme-dropdown-btn');
        const loginDropdownMenu = document.getElementById('login-theme-dropdown-menu');

        function toggleThemeDropdown() { if(dropdownMenu) dropdownMenu.classList.toggle('hidden'); }
        function toggleLoginThemeDropdown() { if(loginDropdownMenu) loginDropdownMenu.classList.toggle('hidden'); }

        if (dropdownBtn) dropdownBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleThemeDropdown(); });
        if (loginDropdownBtn) loginDropdownBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleLoginThemeDropdown(); });

        document.addEventListener('click', () => {
            if (dropdownMenu) dropdownMenu.classList.add('hidden');
            if (loginDropdownMenu) loginDropdownMenu.classList.add('hidden');
        });

        // PEHLI LINE CHANCE KI GAYI HAI (Fast WebSocket connection ke liye):
        const socket = io({
            transports: ['websocket'],
            upgrade: false,
            reconnection: true,
            reconnectionAttempts: 10,
            reconnectionDelay: 1000
        });

        // Baki aapka SAARA CODE BILKUL SAME RAHEGA:
        let myUsername = "";
        let currentlyEditingMsgId = "";
        let typingTimeout = null;

        const usernameModal = document.getElementById('username-modal');
        const usernameForm = document.getElementById('username-form');
        const usernameInput = document.getElementById('username-input');
        const chatLayout = document.getElementById('chat-layout');
        const displayName = document.getElementById('display-name');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const container = document.getElementById('messages-container');
        const usersListContainer = document.getElementById('active-users-list');
        const userCountBadge = document.getElementById('user-count-badge');
        const typingBox = document.getElementById('typing-indicator-box');
        const scrollBottomBtn = document.getElementById('scroll-bottom-btn');

        const sidebarPanel = document.getElementById('sidebar-panel');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const mobileToggle = document.getElementById('mobile-sidebar-toggle');

        function toggleMobileSidebar() {
            sidebarPanel.classList.toggle('-translate-x-full');
            sidebarOverlay.classList.toggle('hidden');
        }
        if(mobileToggle) mobileToggle.addEventListener('click', toggleMobileSidebar);
        if(sidebarOverlay) sidebarOverlay.addEventListener('click', toggleMobileSidebar);

        container.addEventListener('scroll', () => {
            const distanceToBottom = container.scrollHeight - container.scrollTop - container.clientHeight;
            if (distanceToBottom > 250) {
                scrollBottomBtn.classList.remove('hidden');
            } else {
                scrollBottomBtn.classList.add('hidden');
            }
        });

        scrollBottomBtn.addEventListener('click', () => {
            container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
        });

        usernameForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const inputName = usernameInput.value.trim().toUpperCase();
            if (inputName) {
                myUsername = inputName;
                displayName.textContent = myUsername;
                usernameModal.classList.add('hidden');
                chatLayout.classList.remove('hidden');
                socket.emit('store username', myUsername);
            }
        });

        messageInput.addEventListener('input', () => {
            socket.emit('typing');
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                socket.emit('stop typing');
            }, 1500);
        });

        chatForm.addEventListener('submit', function(e) {
            e.preventDefault();
            if (messageInput.value.trim()) {
                socket.emit('stop typing');
                socket.emit('chat message', messageInput.value);
                messageInput.value = '';
            }
        });

        messageInput.addEventListener('focus', () => {
            setTimeout(() => container.scrollTop = container.scrollHeight, 250);
        });

        function appendMessageElement(data) {
            const isMe = data.username === myUsername;
            const alignment = isMe ? 'justify-end' : 'justify-start';
            const bubbleStyle = isMe 
                ? "bg-thm-mBg border-2 border-thm-mBdr text-thm-mTxt shadow-glow rounded-main rounded-tr-none" 
                : "bg-thm-oBg border-2 border-thm-oBdr text-thm-oTxt rounded-main rounded-tl-none";
            
            const label = isMe ? 'YOU' : data.username;
            const glowText = isMe ? 'text-thm-pri' : 'text-thm-sec';
            const finalId = data.id || 'msg_' + Math.random().toString(36).substr(2, 5);
            const safeTextContent = escapeHtml(data.text).replace(/'/g, "\\'");

            const controlButtonsPanel = isMe ? `
                <div class="msg-action-trigger opacity-0 flex items-center gap-3 ml-3 transition-opacity duration-150">
                    <button onclick="openEditModal('${finalId}', '${safeTextContent}')" class="text-thm-mut hover:text-[#00D9FF] text-sm md:text-xs p-1" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button>
                    <button onclick="triggerDeleteMessage('${finalId}')" class="text-thm-mut hover:text-red-500 text-sm md:text-xs p-1" title="Delete"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            ` : '';

            const msgHtml = `
                <div class="flex ${alignment} items-end px-1 mb-2 msg-arrival msg-container-box group" id="dom_${finalId}">
                    <div class="max-w-[85%] md:max-w-[70%] relative">
                        <div class="flex items-center justify-between">
                            <span class="text-[9px] font-bold ${glowText} tracking-widest block mb-1.5 ml-1 font-head uppercase">${label}</span>
                            ${controlButtonsPanel}
                        </div>
                        <div class="${bubbleStyle} px-4 py-3 text-xs md:text-sm break-words relative cyber-clip-sm">
                            <div class="theme-deco absolute top-0 right-0 w-2.5 h-2.5 ${isMe ? 'bg-thm-pri shadow-glow' : 'bg-thm-sec'}"></div>
                            <span class="msg-body-content">${escapeHtml(data.text)}</span>
                        </div>
                        <span class="text-[8px] text-thm-mut font-bold block mt-1.5 mx-1 font-mono uppercase tracking-widest ${isMe ? 'text-right' : ''}">
                            TIMESTAMP: ${data.timestamp} <span class="msg-edited-status text-thm-pri ml-1 ${data.edited ? '' : 'hidden'}">(EDITED)</span>
                        </span>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', msgHtml);
        }

        // --- SYSTEM LOGGER ALERTS ---
        socket.on('system notification', function(text) {
            const systemHtml = `
                <div class="flex justify-center my-3 animate-pulse px-4">
                    <div class="bg-thm-panel/40 border border-thm-bdr/20 text-thm-mut text-[8px] md:text-[9px] px-4 py-1.5 tracking-[0.2em] font-head font-bold uppercase rounded-btn text-center max-w-full truncate">
                        <i class="fa-solid fa-circle-notch animate-spin mr-1.5 text-thm-pri"></i> ${text}
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', systemHtml);
            container.scrollTop = container.scrollHeight;
        });

        // --- LIVE REALTIME TYPING INDICATORS ---
        let currentTypingPeers = {};
        socket.on('user typing', function(data) {
            currentTypingPeers[data.id] = data.username;
            renderTypingBox();
        });

        socket.on('user stop typing', function(id) {
            delete currentTypingPeers[id];
            renderTypingBox();
        });

        function renderTypingBox() {
            const activeList = Object.values(currentTypingPeers);
            if(activeList.length > 0) {
                typingBox.innerHTML = `<span class="h-1.5 w-1.5 rounded-full bg-thm-pri animate-ping"></span> 
                <span>${activeList.join(', ')} is typing<span class="blink-fast">...</span></span>`;
            } else {
                typingBox.innerHTML = '';
            }
        }

        window.openEditModal = function(id, currentText) {
            currentlyEditingMsgId = id;
            editMessageInput.value = currentText;
            document.getElementById('edit-modal').classList.remove('hidden');
            document.getElementById('edit-modal').classList.add('flex');
            setTimeout(() => editMessageInput.focus(), 50);
        };

        window.closeEditModal = function() {
            document.getElementById('edit-modal').classList.add('hidden');
            document.getElementById('edit-modal').classList.remove('flex');
            currentlyEditingMsgId = "";
        };

        document.getElementById('save-edit-btn').addEventListener('click', () => {
            const updatedContentText = editMessageInput.value.trim();
            if (updatedContentText && currentlyEditingMsgId) {
                socket.emit('edit message', { id: currentlyEditingMsgId, text: updatedContentText });
                closeEditModal();
            }
        });

        window.triggerDeleteMessage = function(id) {
            if (confirm("Are you sure you want to delete this message?")) {
                socket.emit('delete message', id);
            }
        };

        socket.on('chat message', function(data) {
            appendMessageElement(data);
            container.scrollTop = container.scrollHeight;
        });

        socket.on('load history', function(historyArray) {
            container.innerHTML = '';
            historyArray.forEach(msg => appendMessageElement(msg));
            container.scrollTop = container.scrollHeight;
        });

        socket.on('message edited', function(updatedData) {
            const targetElement = document.getElementById(`dom_${updatedData.id}`);
            if (targetElement) {
                const textWrapper = targetElement.querySelector('.msg-body-content');
                const editedIndicator = targetElement.querySelector('.msg-edited-status');
                if (textWrapper) textWrapper.textContent = updatedData.text;
                if (editedIndicator) editedIndicator.classList.remove('hidden');
            }
        });

        socket.on('message deleted', function(id) {
            const deadElement = document.getElementById(`dom_${id}`);
            if (deadElement) {
                deadElement.style.opacity = '0';
                setTimeout(() => deadElement.remove(), 250);
            }
        });

        socket.on('update user list', function(activeUsernamesArray) {
            usersListContainer.innerHTML = ''; 
            userCountBadge.textContent = `${activeUsernamesArray.length}`;
            activeUsernamesArray.forEach(username => {
                const isMe = username === myUsername;
                const activeHtml = `
                    <div class="flex items-center justify-between py-2.5 px-3 bg-thm-panel border ${isMe ? 'border-thm-pri shadow-glow' : 'border-thm-bdr/50'} rounded-btn">
                        <div class="flex items-center space-x-2.5 min-w-0">
                            <span class="w-2 h-2 rounded-full ${isMe ? 'bg-thm-pri shadow-glow' : 'bg-[#2563EB]'}"></span>
                            <h4 class="text-xs font-bold truncate font-head ${isMe ? 'text-thm-pri' : 'text-thm-txt'}">${username}</h4>
                        </div>
                    </div>`;
                usersListContainer.insertAdjacentHTML('beforeend', activeHtml);
            });
        });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
